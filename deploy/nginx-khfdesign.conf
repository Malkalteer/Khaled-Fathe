# إعدادات nginx لموقع khfdesign.cloud
# الواجهة (React) تُعرض من frontEnd/dist، والـ API يُحوَّل إلى Node.js على المنفذ 5000.

server {
    listen 80;
    server_name khfdesign.cloud www.khfdesign.cloud;
    return 301 https://khfdesign.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    server_name khfdesign.cloud www.khfdesign.cloud;

    ssl_certificate /etc/letsencrypt/live/khfdesign.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khfdesign.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # الحد الأقصى لحجم الرفع (صور حتى 10MB وملفات تصميم حتى 25MB)
    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    root /var/www/khfdesign/frontEnd/dist;
    index index.html;

    # ---------- الخادم (Node.js) ----------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # عنوان الزائر الحقيقي (مهم لحد عدد الطلبات وقفل الحساب)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000;
    }

    # ---------- الواجهة (React) ----------
    # ملفات البناء تحمل بصمة في اسمها، لذلك تُخزَّن في المتصفح لمدة سنة
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html لا يُخزَّن حتى يرى الزوار التحديثات فوراً
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # روابط مثل /project/123 و /admin تفتح التطبيق نفسه
    location / {
        try_files $uri $uri/ /index.html;
    }
}
